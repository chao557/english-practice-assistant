<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Practice</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #1e293b;
      color: white;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 16px; font-weight: 600; }
    #status { font-size: 12px; opacity: 0.8; }
    main {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.4;
      font-size: 14px;
    }
    .user {
      background: #e0f2fe;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .bot {
      background: white;
      border: 1px solid #e2e8f0;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .hint {
      align-self: center;
      color: #64748b;
      font-size: 12px;
      font-style: italic;
    }
    #settings {
      display: none;
      padding: 12px 16px;
      background: #f1f5f9;
      border-top: 1px solid #e2e8f0;
      gap: 8px;
      flex-wrap: wrap;
    }
    #settings.open { display: flex; }
    #settings input {
      flex: 1;
      min-width: 120px;
      padding: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 13px;
    }
    #voicePanel {
      display: none;
      padding: 12px 16px;
      background: #fff7ed;
      border-top: 1px solid #fed7aa;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    #voicePanel.open { display: flex; }
    #voicePanel span { font-size: 13px; color: #7c2d12; }
    footer {
      padding: 12px 16px;
      background: white;
      border-top: 1px solid #e2e8f0;
      display: flex;
      gap: 8px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
    }
    button {
      padding: 10px 16px;
      background: #1e293b;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background: #334155; }
    button.recording { background: #dc2626; }
    .row { display: flex; gap: 8px; align-items: center; }
  </style>
</head>
<body>
  <header>
    <h1>English Practice</h1>
    <span id="status">Loading...</span>
  </header>

  <main id="chat"></main>

  <div id="settings">
    <input id="apiKey" type="password" placeholder="ARK API Key" />
    <input id="baseUrl" type="url" placeholder="https://ark.cn-beijing.volces.com/api/v3" />
    <input id="model" type="text" placeholder="doubao-pro-32k / ep-xxxx" />
    <button id="saveBtn">Save</button>
  </div>

  <div id="voicePanel">
    <span>男生声音标准：</span>
    <button id="recordRefBtn">录制参考声音</button>
    <span id="refStatus">未录制</span>
  </div>

  <footer>
    <button id="micBtn">Start Mic</button>
    <input id="textInput" type="text" placeholder="Type in English..." />
    <button id="sendBtn">Send</button>
    <button id="voiceBtn">Voice</button>
    <button id="gearBtn">⚙</button>
  </footer>

  <script>
    const SYSTEM_PROMPT = `You are a 30-year-old product marketing manager at Yutong Bus in Zhengzhou, China. You have two kids. You are friendly and speak practical conversational English. Reply in English only. Keep responses short (1-3 sentences). Be a natural listener. Do not correct grammar or act like a teacher. Never reveal you are an AI.`;

    const chat = document.getElementById('chat');
    const status = document.getElementById('status');
    const settings = document.getElementById('settings');
    const voicePanel = document.getElementById('voicePanel');
    const textInput = document.getElementById('textInput');
    const micBtn = document.getElementById('micBtn');
    const gearBtn = document.getElementById('gearBtn');
    const saveBtn = document.getElementById('saveBtn');
    const voiceBtn = document.getElementById('voiceBtn');
    const recordRefBtn = document.getElementById('recordRefBtn');
    const refStatus = document.getElementById('refStatus');

    let lastBotText = '';
    let recognition = null;
    let isListening = false;
    let audioCtx = null;
    let analyser = null;
    let micStream = null;
    let pitchHistory = [];
    let refPitch = null;
    let isRecordingRef = false;
    let refSamples = [];

    function addMsg(role, text) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function addHint(text) {
      const div = document.createElement('div');
      div.className = 'hint';
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function setStatus(t) { status.textContent = t; }

    function loadSettings() {
      const s = JSON.parse(localStorage.getItem('ep_settings') || '{}');
      document.getElementById('apiKey').value = s.apiKey || '';
      document.getElementById('baseUrl').value = s.baseUrl || 'https://ark.cn-beijing.volces.com/api/v3';
      document.getElementById('model').value = s.model || '';
      refPitch = s.refPitch || null;
      updateRefStatus();
    }

    function saveSettings() {
      localStorage.setItem('ep_settings', JSON.stringify({
        apiKey: document.getElementById('apiKey').value,
        baseUrl: document.getElementById('baseUrl').value,
        model: document.getElementById('model').value,
        refPitch: refPitch
      }));
      settings.classList.remove('open');
      setStatus('Saved');
    }

    function updateRefStatus() {
      refStatus.textContent = refPitch ? `已录制 (${Math.round(refPitch)} Hz)` : '未录制';
    }

    function levenshtein(a, b) {
      const m = Array.from({ length: a.length + 1 }, (_, i) => [i]);
      for (let j = 1; j <= b.length; j++) m[0][j] = j;
      for (let i = 1; i <= a.length; i++)
        for (let j = 1; j <= b.length; j++)
          m[i][j] = Math.min(m[i-1][j]+1, m[i][j-1]+1, m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
      return m[a.length][b.length];
    }

    function isShadowing(userText, botText) {
      const clean = s => s.toLowerCase().replace(/[^\w\s]/g, '').trim();
      const a = clean(botText).split(/\s+/).filter(Boolean);
      const b = clean(userText).split(/\s+/).filter(Boolean);
      if (b.length < 4) return false;
      const d = levenshtein(a, b);
      const sim = 1 - d / Math.max(a.length, b.length);
      return sim >= 0.75;
    }

    function detectPitch(buffer, sampleRate) {
      const SIZE = buffer.length;
      let bestOffset = -1;
      let bestCorrelation = 0;
      let rms = 0;

      for (let i = 0; i < SIZE; i++) {
        const val = buffer[i];
        rms += val * val;
      }
      rms = Math.sqrt(rms / SIZE);
      if (rms < 0.01) return 0;

      let foundGoodCorrelation = false;
      const correlations = new Array(SIZE).fill(0);
      for (let offset = 1; offset < SIZE; offset++) {
        let correlation = 0;
        for (let i = 0; i < SIZE - offset; i++) {
          correlation += Math.abs(buffer[i] - buffer[i + offset]);
        }
        correlation = 1 - correlation / (SIZE - offset);
        correlations[offset] = correlation;
        if (correlation > 0.9 && correlation > bestCorrelation) {
          foundGoodCorrelation = true;
          bestCorrelation = correlation;
          bestOffset = offset;
        }
      }

      if (!foundGoodCorrelation) return 0;
      return sampleRate / bestOffset;
    }

    async function initAudio() {
      if (audioCtx) return;
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createMediaStreamSource(micStream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      source.connect(analyser);
      analyseLoop();
    }

    function analyseLoop() {
      if (!analyser) return;
      const buffer = new Float32Array(analyser.fftSize);
      analyser.getFloatTimeDomainData(buffer);
      const pitch = detectPitch(buffer, audioCtx.sampleRate);
      if (pitch > 50 && pitch < 600) {
        pitchHistory.push(pitch);
        if (pitchHistory.length > 50) pitchHistory.shift();
      }
      requestAnimationFrame(analyseLoop);
    }

    function getRecentPitch() {
      if (pitchHistory.length === 0) return 0;
      const sorted = [...pitchHistory].sort((a, b) => a - b);
      return sorted[Math.floor(sorted.length * 0.5)];
    }

    function isMaleVoice() {
      if (!refPitch) {
        const p = getRecentPitch();
        return p > 50 && p < 165;
      }
      const p = getRecentPitch();
      return p > 50 && p < refPitch * 1.35;
    }

    async function recordReference() {
      if (isRecordingRef) return;
      await initAudio();
      isRecordingRef = true;
      recordRefBtn.textContent = '录制中...';
      recordRefBtn.classList.add('recording');
      refSamples = [];
      pitchHistory = [];

      const collect = setInterval(() => {
        const p = getRecentPitch();
        if (p > 50 && p < 600) refSamples.push(p);
      }, 100);

      setTimeout(() => {
        clearInterval(collect);
        isRecordingRef = false;
        recordRefBtn.textContent = '录制参考声音';
        recordRefBtn.classList.remove('recording');
        if (refSamples.length > 0) {
          refSamples.sort((a, b) => a - b);
          refPitch = refSamples[Math.floor(refSamples.length * 0.5)];
          updateRefStatus();
          setStatus('Reference recorded');
        } else {
          setStatus('No voice detected');
        }
      }, 3000);
    }

    async function askLLM(text) {
      const apiKey = document.getElementById('apiKey').value.trim();
      const baseUrl = document.getElementById('baseUrl').value.trim() || 'https://ark.cn-beijing.volces.com/api/v3';
      const model = document.getElementById('model').value.trim();

      if (!apiKey || !model) {
        setStatus('Set API Key and Model first');
        settings.classList.add('open');
        return null;
      }

      setStatus('Thinking...');
      try {
        const res = await fetch(`${baseUrl.replace(/\/$/, '')}/chat/completions`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
          body: JSON.stringify({
            model,
            messages: [
              { role: 'system', content: SYSTEM_PROMPT },
              { role: 'user', content: text }
            ],
            temperature: 0.8,
            max_tokens: 120
          })
        });
        const data = await res.json();
        return data.choices?.[0]?.message?.content?.trim() || '';
      } catch (e) {
        setStatus('Error: ' + e.message);
        return null;
      }
    }

    function speak(text) {
      if (!window.speechSynthesis) return;
      setStatus('Speaking...');
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.onend = () => setStatus(isListening ? 'Listening...' : 'Ready');
      speechSynthesis.speak(u);
    }

    async function handleInput(text) {
      if (!text) return;
      addMsg('user', text);

      if (lastBotText && isShadowing(text, lastBotText)) {
        addHint('Shadowing detected — no response');
        return;
      }

      const reply = await askLLM(text);
      if (reply) {
        lastBotText = reply;
        addMsg('bot', reply);
        speak(reply);
      }
    }

    function initSpeech() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { setStatus('Speech not supported'); return; }
      recognition = new SR();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      let interimEl = null;
      recognition.onresult = (e) => {
        const r = e.results[e.results.length - 1];
        const t = r[0].transcript.trim();
        if (r.isFinal) {
          if (interimEl) interimEl.remove();
          pitchHistory = [];
          setTimeout(() => {
            if (isMaleVoice()) {
              addHint('Male voice ignored');
              return;
            }
            handleInput(t);
          }, 200);
        } else {
          if (interimEl) interimEl.remove();
          interimEl = document.createElement('div');
          interimEl.className = 'msg user';
          interimEl.style.opacity = '0.6';
          interimEl.textContent = t;
          chat.appendChild(interimEl);
          chat.scrollTop = chat.scrollHeight;
        }
      };

      recognition.onend = () => {
        if (isListening) setTimeout(() => recognition.start(), 300);
      };

      recognition.onerror = (e) => {
        setStatus('Mic error: ' + e.error);
        isListening = false;
        micBtn.textContent = 'Start Mic';
      };
    }

    async function toggleMic() {
      if (!recognition) initSpeech();
      await initAudio();
      if (isListening) {
        isListening = false;
        recognition.stop();
        micBtn.textContent = 'Start Mic';
        setStatus('Paused');
      } else {
        isListening = true;
        recognition.start();
        micBtn.textContent = 'Stop Mic';
        setStatus('Listening...');
      }
    }

    micBtn.addEventListener('click', toggleMic);
    gearBtn.addEventListener('click', () => settings.classList.toggle('open'));
    voiceBtn.addEventListener('click', () => voicePanel.classList.toggle('open'));
    saveBtn.addEventListener('click', saveSettings);
    recordRefBtn.addEventListener('click', recordReference);
    document.getElementById('sendBtn').addEventListener('click', () => {
      const t = textInput.value.trim();
      if (t) { textInput.value = ''; handleInput(t); }
    });
    textInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('sendBtn').click();
    });

    loadSettings();
    setStatus('Ready');
  </script>
</body>
</html>
